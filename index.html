<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />


    <!-- SEO dasar + Open Graph untuk preview link di WhatsApp/Telegram/Facebook.
         __SITE_URL__ diganti saat build oleh plugin `siteUrlPlugin` di vite.config.ts
         (VITE_SITE_URL -> domain production Vercel -> https://boosteryuk.com), karena
         WhatsApp mewajibkan URL gambar absolut. Gambar: public/og-image.jpg (1200x630 JPG,
         < 300 KB, rasio 1.91:1 sesuai syarat WhatsApp). -->
    <meta name="description" data-seo-static content="Boosteryuk adalah SMM Panel Indonesia untuk layanan followers, likes, views, dan engagement TikTok, Instagram, YouTube, serta platform lainnya. Nikmati pemesanan online, harga transparan, dan dukungan pelanggan." />
    <meta property="og:site_name" data-seo-static content="Boosteryuk" />
    <meta property="og:locale" data-seo-static content="id_ID" />
    <meta property="og:type" data-seo-static content="website" />
    <meta property="og:url" data-seo-static content="__SITE_URL__/" />
    <meta property="og:title" data-seo-static content="Boosteryuk — SMM Panel Indonesia & Jasa Booster Media Sosial" />
    <meta property="og:description" data-seo-static content="Boosteryuk adalah SMM Panel Indonesia untuk layanan followers, likes, views, dan engagement TikTok, Instagram, YouTube, serta platform lainnya. Nikmati pemesanan online, harga transparan, dan dukungan pelanggan." />
    <meta property="og:image" data-seo-static content="__SITE_URL__/og-image.jpg?v=4" />
    <meta property="og:image:secure_url" content="__SITE_URL__/og-image.jpg?v=4" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Boosteryuk — SMM Panel Indonesia & Jasa Booster Media Sosial (SMM Panel)" />

    <!-- Twitter / X Preview -->
    <meta name="twitter:card" data-seo-static content="summary_large_image" />
    <meta name="twitter:title" data-seo-static content="Boosteryuk — SMM Panel Indonesia & Jasa Booster Media Sosial" />
    <meta name="twitter:description" data-seo-static content="SMM Panel Indonesia untuk followers, likes, views, dan engagement TikTok, Instagram, YouTube, serta platform lainnya." />
    <meta name="twitter:image" data-seo-static content="__SITE_URL__/og-image.jpg?v=4" />

    <!-- Favicon (logo Boosteryuk, latar transparan). Bisa diganti admin di Pengaturan Website. -->
    <link id="app-favicon" rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <title data-seo-static>Boosteryuk — SMM Panel Indonesia & Jasa Booster Media Sosial</title>

    <script>
      /* FIX: dulu setiap error/promise-reject memunculkan alert() ke user (spam popup +
         bocor nama file & baris). Diganti console.error agar senyap bagi pengguna. */
      window.addEventListener('error', function (e) {
        console.error('JS ERROR:', e.message, e.filename + ':' + e.lineno);
      });
      window.addEventListener('unhandledrejection', function (e) {
        console.error('PROMISE ERROR:', (e.reason && e.reason.message) || e.reason);
      });

      /* Terapkan tema tersimpan sebelum paint pertama. Default = light. */
      try {
        var t = localStorage.getItem('bt-theme');
        if (t === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      } catch (e) {
        console.error('THEME ERROR:', e && e.message);
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
